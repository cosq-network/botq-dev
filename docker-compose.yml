services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: botq
      # Development fallback; set POSTGRES_PASSWORD explicitly for shared or
      # production-like environments.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botq-dev-password}
      POSTGRES_DB: botq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botq -d botq"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5446:5432"
    networks:
      - internal

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://botq:${POSTGRES_PASSWORD:-botq-dev-password}@db:5432/botq
      GIT_KEY_DIR: /srv/botq/secrets/git
      GIT_KNOWN_HOSTS: /srv/botq/secrets/git/known_hosts
      SANDBOX_WORKSPACE_DIR: /srv/botq/workspaces
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - gitkeys:/srv/botq/secrets/git
      - workspaces:/srv/botq/workspaces
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - internal
    expose:
      - "5000"

  worker:
    build: ./backend
    command: >
      sh -c "python -m app.sandbox_worker"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://botq:${POSTGRES_PASSWORD:-botq-dev-password}@db:5432/botq
      GIT_KEY_DIR: /srv/botq/secrets/git
      GIT_KNOWN_HOSTS: /srv/botq/secrets/git/known_hosts
      SANDBOX_WORKSPACE_DIR: /srv/botq/workspaces
    volumes:
      - gitkeys:/srv/botq/secrets/git
      - workspaces:/srv/botq/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Restrict API-side Docker access to the endpoints required by sandbox runs.
  # The worker retains the raw socket because it is the trusted execution boundary.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      DELETE: "1"
      IMAGES: "1"
      INFO: "1"
      POST: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8884:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - internal

  # Throwaway real SSH git remote for the Phase 1 pilot-clone validation.
  # Gated behind the "git-validation" profile so it never starts in normal use.
  git-fixture:
    image: botq/git-fixture:dev
    build:
      context: ./dev/git-fixture
    profiles: ["git-validation"]
    networks:
      - internal
    expose:
      - "22"

volumes:
  pgdata:
  gitkeys:
  workspaces:

networks:
  internal:
    driver: bridge
