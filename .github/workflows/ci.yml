name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: botq
          POSTGRES_PASSWORD: botq
          POSTGRES_DB: botq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Accessibility baseline
        run: python ../scripts/validate_accessibility.py --json

      - name: Provider configuration baseline
        run: python ../scripts/validate_provider_config.py --json

      - name: Security baseline
        run: python ../scripts/validate_security_baseline.py --json

      - name: Static security analysis
        run: bandit -q -r app

      - name: Secret-pattern scan
        run: "! rg -n --hidden --glob '!.git/**' --glob '!.pilot-evidence/**' --glob '!pilot-botq-dev/**' '(AKIA|-----BEGIN|ghp_|github_pat_|xox[baprs]-)' ."

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Test (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://botq:botq@localhost:5432/botq
          AUDIT_SECRET: ci-audit-secret
          SECRET_KEY: ci-secret-key
        run: pytest --cov=app --cov-report=term-missing

      - name: Publish verification evidence
        if: always()
        run: |
          mkdir -p evidence
          python ../scripts/validate_security_baseline.py --json > evidence/security.json
          python ../scripts/validate_accessibility.py --json > evidence/accessibility.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-evidence
          path: backend/evidence/

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t botq/api:ci ./backend

  e2e:
    name: Dockerized API E2E
    runs-on: ubuntu-latest
    needs: [lint-test, build]
    env:
      POSTGRES_PASSWORD: BotqE2e-CI-2026
      BOTQ_E2E_PASSWORD: E2ePass!2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install E2E test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Dockerized E2E suite
        shell: pwsh
        run: ./scripts/run_e2e.ps1
